name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/configure-pages@v4
        with:
          enablement: true
      - run: npm ci
      - run: npm run build
        env:
          DEPLOY_BASE: /
          # Vite inlines these into the bundle at build time. Both are public
          # by design — the database is protected by Row-Level Security, not by
          # hiding this key (see supabase/schema.sql). They live in repository
          # secrets so no credential sits in the source, and so the project can
          # be swapped without a code change.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # SPA fallback: GitHub Pages serves 404.html for unknown paths,
      # which lets React Router handle deep links like /article/<slug>
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
